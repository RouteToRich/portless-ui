# Console CI: every push and pull request. Branch protection on main should require "build".
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Type check
        run: npm run lint
      - name: Unit and component tests (Vitest)
        run: npm test
      - name: Build
        run: npm run build
      - name: npm audit (high and critical; reported, not blocking yet)
        continue-on-error: true
        run: npm audit --audit-level=high --omit=dev
